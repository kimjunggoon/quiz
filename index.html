<!DOCTYPE html><html lang="ko"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>휘문고등학교 역사 퀴즈</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#efe9da;--grid:#e1d9c3;--card:#fffdf6;--tx:#26231d;--mut:#7a7466;--bd:#d9d1bc;--ac:#c0392b;--ok:#2f6f4e;--no:#c0392b;--okbg:#e3f0e6;--nobg:#fbe6e1;--board:#2f4a3c;--frame:#8b6b43;--chalk:#f4f1e6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1d1a;--grid:#242722;--card:#262822;--tx:#ecebe3;--mut:#a29f92;--bd:#3d4038;--ac:#ef7b6c;--ok:#7fd1a0;--no:#ef7b6c;--okbg:#1c3427;--nobg:#3d211d;--board:#1f3328;--frame:#5a4630;--chalk:#ece9dc}}
:root[data-theme="dark"]{--bg:#1b1d1a;--grid:#242722;--card:#262822;--tx:#ecebe3;--mut:#a29f92;--bd:#3d4038;--ac:#ef7b6c;--ok:#7fd1a0;--no:#ef7b6c;--okbg:#1c3427;--nobg:#3d211d;--board:#1f3328;--frame:#5a4630;--chalk:#ece9dc}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg) linear-gradient(var(--grid) 1px,transparent 1px) 0 0/100% 28px;color:var(--tx);font-family:"Gowun Batang","Apple SD Gothic Neo","Noto Sans KR",serif;line-height:1.65}
main{max-width:620px;margin:0 auto;padding:18px 14px 40px}
.board{background:var(--board);border:10px solid var(--frame);border-radius:6px;padding:16px 18px 12px;text-align:center;color:var(--chalk);box-shadow:0 4px 0 rgba(0,0,0,.25),inset 0 0 30px rgba(0,0,0,.25);position:relative}
.board:after{content:"";position:absolute;left:14px;right:14px;bottom:-22px;height:8px;background:var(--frame);border-radius:0 0 4px 4px;opacity:.0}
h1{font-family:"Nanum Pen Script","Gowun Batang",cursive;font-weight:400;font-size:40px;line-height:1.15;margin:0;letter-spacing:1px}
.sub{font-size:14px;margin:4px 0 0;opacity:.85}
.motto{font-family:"Nanum Pen Script","Gowun Batang",cursive;font-size:22px;margin-top:6px;opacity:.9}
.tray{height:8px;margin:0 12px 22px;background:var(--frame);border-radius:0 0 6px 6px}
.card{background:var(--card);border:1px solid var(--bd);border-left:3px double var(--ac);border-radius:4px;padding:20px 20px 22px 22px;box-shadow:0 2px 0 var(--bd),0 8px 18px rgba(0,0,0,.08)}
.bar{height:8px;background:var(--bd);border-radius:2px;margin:0 0 14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-bottom:10px;border-bottom:1px dashed var(--bd);padding-bottom:6px}
.q{font-size:19px;font-weight:700;margin:0 0 16px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:inherit;background:transparent;border:0;border-bottom:1px dotted var(--bd);padding:10px 6px;cursor:pointer}
.opt:hover:not(:disabled){background:var(--grid)}
.opt .n{flex:none;width:26px;height:26px;border:1.5px solid var(--mut);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:14px;line-height:1}
.opt.ok{background:var(--okbg)}.opt.ok .n{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{background:var(--nobg)}.opt.no .n{background:var(--no);border-color:var(--no);color:#fff}
.opt:disabled{cursor:default}
.exp{margin-top:16px;padding:12px 14px;border:1.5px dashed var(--ac);background:var(--bg);border-radius:6px;font-size:15px}
.exp b{color:var(--ac)}
.btn{font:inherit;font-weight:700;background:var(--board);color:var(--chalk);border:3px solid var(--frame);border-radius:6px;padding:11px 20px;cursor:pointer;margin-top:14px;width:100%}
.score{width:150px;height:150px;border:4px solid var(--ac);border-radius:50%;margin:10px auto;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ac);font-family:"Nanum Pen Script","Gowun Batang",cursive;transform:rotate(-6deg)}
.score b{font-size:56px;font-weight:400;line-height:1}.score span{font-size:20px}
.note{font-size:12px;color:var(--mut);margin-top:18px;text-align:center}

.in{width:100%;box-sizing:border-box;font:inherit;font-size:18px;padding:10px 12px;border:1.5px solid var(--mut);border-radius:6px;background:var(--bg);color:var(--tx);margin:6px 0}
.err{color:var(--no);font-size:14px;min-height:20px}
.opt.sel{background:var(--grid)}.opt.sel .n{background:var(--board);border-color:var(--board);color:var(--chalk)}
.btn:disabled{opacity:.5;cursor:default}
.btn.sub{background:transparent;color:var(--tx);border-color:var(--bd);margin-top:8px}
.rk{text-align:center;font-size:20px;font-weight:700;margin:4px 0}.rk b{color:var(--ac);font-size:30px}
table{width:100%;border-collapse:collapse;margin-top:8px}td,th{padding:6px 8px;border-bottom:1px dotted var(--bd);text-align:left}th{color:var(--mut);font-weight:400;font-size:13px}td.r{text-align:right}
.rv{margin:10px 0;padding:10px 12px;border-left:3px solid var(--ac);background:var(--bg);font-size:14px}
body.big main{max-width:900px}body.big td,body.big th{font-size:22px;padding:10px}
</style></head><body><main>
<div class="board"><h1>휘문고등학교 역사 퀴즈</h1><p class="sub">영광과 불명예, 두 얼굴의 역사를 모두 다룹니다.</p><div class="motto">🌳 큰 사람이 되자 🌳</div></div><div class="tray"></div>
<div class="card" id="app"></div>
<p class="note">※ 언론 보도·한국학중앙연구원 등 공개 자료와 재학생 제공 정보 기반.</p></main>
<script>
const $=id=>document.getElementById(id),app=$("app");
const PAGE=<?!= JSON.stringify(page) ?>;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const run=(fn,...a)=>new Promise((ok,ng)=>google.script.run.withSuccessHandler(ok).withFailureHandler(ng)[fn](...a));
let nick="",qs=[],i=0,picks=[];
const wait=m=>{app.innerHTML=`<p style="text-align:center;padding:30px 0">${m}</p>`};
const fail=()=>{app.innerHTML=`<p class="err">연결에 문제가 생겼어요. 잠시 후 다시 시도해 주세요.</p><button class="btn" onclick="home()">처음으로</button>`};
const table=b=>`<table><tr><th>석차</th><th>닉네임</th><th style="text-align:right">점수</th></tr>${b.rows.map(r=>`<tr><td>${r.rank}</td><td>${esc(r.nick)}</td><td class="r">${r.score}</td></tr>`).join("")}</table><p class="note">참가자 ${b.count}명 · 동점자는 같은 석차</p>`;
function home(){
app.innerHTML=`<p class="q">닉네임을 입력하고 시작하세요</p><p class="sub" style="color:var(--mut);margin:0">이름 대신 닉네임을 써 주세요. (1~12자, 닉네임당 1회 참여)</p><input class="in" id="nk" maxlength="12" placeholder="닉네임"><div class="err" id="er"></div><button class="btn" id="go">퀴즈 시작</button><button class="btn sub" id="bd">순위판 보기</button>`;
$("bd").onclick=showBoard;
$("go").onclick=async()=>{const v=$("nk").value;$("go").disabled=true;try{const r=await run("getQuiz",v);if(r.error){$("er").textContent=r.error;$("go").disabled=false;return}nick=v.trim();qs=r.questions;i=0;picks=[];ask()}catch(e){fail()}};
}
function ask(){
const x=qs[i];let sel=null;
app.innerHTML=`<div class="bar"><i style="width:${i/qs.length*100}%"></i></div><div class="meta"><span>${i+1} / ${qs.length}</span><span>${esc(nick)}</span></div><p class="q">${esc(x.q)}</p>${x.o.map((o,k)=>`<button class="opt" data-k="${k}"><span class="n">${"①②③④⑤"[k]}</span><span>${esc(o)}</span></button>`).join("")}<button class="btn" id="nx" disabled>${i<qs.length-1?"다음 문제":"제출하고 결과 보기"}</button>`;
const bs=app.querySelectorAll(".opt");
bs.forEach(b=>b.onclick=()=>{bs.forEach(c=>c.classList.remove("sel"));b.classList.add("sel");sel=x.o[+b.dataset.k];$("nx").disabled=false});
$("nx").onclick=()=>{picks.push({id:x.id,answer:sel});i++;i<qs.length?ask():submit()};
}
async function submit(){
wait("채점 중…");
try{const r=await run("submitScore",nick,picks);if(r.error){app.innerHTML=`<p class="err">${esc(r.error)}</p><button class="btn" onclick="home()">처음으로</button>`;return}result(r)}catch(e){fail()}
}
function result(r){
const bad=r.review.filter(v=>!v.ok);
app.innerHTML=`<div class="bar"><i style="width:100%"></i></div><p style="text-align:center;margin:0;color:var(--mut)">성적표 · ${esc(nick)}</p><div class="score"><b>${Math.round(r.score/r.total*100)}</b><span>점 (${r.score}/${r.total})</span></div><div class="rk">${r.count}명 중 <b>${r.rank}</b>등 · 상위 <b>${r.top}</b>%</div><p class="note" style="margin-top:0">동점자는 같은 석차예요. 석차와 백분위는 이후 참가자에 따라 달라질 수 있어요.</p><p class="q" style="margin-top:18px">${bad.length?"틀린 문제 해설":"전부 정답! 🎉"}</p>${bad.map(v=>`<div class="rv"><b>${esc(v.q)}</b><br>내 답: ${esc(v.picked)}<br>정답: <b>${esc(v.correct)}</b><br>${esc(v.e)}</div>`).join("")}<p class="q" style="margin-top:18px">순위 TOP 10</p>${table(r.board)}<button class="btn sub" onclick="location.reload()">처음 화면으로</button>`;
}
async function showBoard(){wait("불러오는 중…");try{const b=await run("getBoard",10);app.innerHTML=`<p class="q">순위 TOP 10</p>${table(b)}<button class="btn" onclick="home()">돌아가기</button>`}catch(e){fail()}}
async function live(){try{const b=await run("getBoard",20);app.innerHTML=`<p class="q" style="text-align:center">실시간 순위 TOP 20</p>${table(b)}`}catch(e){}}
if(PAGE==="board"){document.body.classList.add("big");live();setInterval(live,10000)}else home();
</script></body></html>
